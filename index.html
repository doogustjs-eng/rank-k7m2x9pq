<title>썬키다 검색 순위</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 위에 종류 탭, 그 아래 상품 카드 줄, 고른 상품의 날짜별 순위표 하나. 표가 주인공이라 나머지는 조용하게. */
:root{--bg:#f6f7f4;--panel:#ffffff;--fg:#1f2a24;--muted:#6a776f;--line:#dde3dd;--accent:#1d6b4f;--accent-soft:#e3f1ea;--up:#c5392a;--down:#2c62b8;--none:#9aa59d;
 --font:'IBM Plex Sans KR','Malgun Gothic',system-ui,sans-serif;--mono:'IBM Plex Mono',Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171b19;--panel:#202623;--fg:#e8ece8;--muted:#9aa69e;--line:#333b36;--accent:#6fcf9f;--accent-soft:#213b30;--up:#ff7b6b;--down:#7fa8ef;--none:#6f7a73;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171b19;--panel:#202623;--fg:#e8ece8;--muted:#9aa69e;--line:#333b36;--accent:#6fcf9f;--accent-soft:#213b30;--up:#ff7b6b;--down:#7fa8ef;--none:#6f7a73;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);margin:0;padding-block:20px 40px;padding-inline:16px}
.wrap{max-width:1200px;margin:auto}
h1{font-size:22px;font-weight:600;margin:0 0 4px;text-wrap:balance}.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{font:inherit;font-weight:500;padding:9px 16px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--fg);cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{color:var(--muted);font-size:12px;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.card{font:inherit;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;color:var(--fg);display:block;min-width:0}
.card.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.card img,.card .noimg{width:100%;aspect-ratio:1;max-width:100%;object-fit:cover;border-radius:6px;background:var(--line);display:block}
.card .noimg{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.card .nm{margin-top:7px;font-weight:500;font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .kw{color:var(--muted);font-size:11px;margin-top:3px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.panel h2{font-size:16px;font-weight:600;margin:0 0 10px;text-wrap:balance}.panel h2 a{color:var(--accent);font-size:12px;font-weight:500;margin-left:8px;text-decoration:none}
.scroll{overflow-x:auto}table{border-collapse:collapse;min-width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center}
th{font-weight:500;color:var(--muted);font-size:12px;position:sticky;top:0;background:var(--panel)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--panel);font-weight:500}
th:first-child{z-index:1}
td .r{font-family:var(--mono);font-weight:500;font-size:14px}td .d{font-size:11px;margin-left:3px}td .up{color:var(--up)}td .down{color:var(--down)}td .none{color:var(--none)}td .ad{display:block;font-size:10px;color:var(--muted)}
.empty{color:var(--muted);padding:20px 0}
.legend{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.7}
@media(max-width:600px){body{padding-block:14px 30px}.cards{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}th,td{padding:7px 8px}}
</style>
<div class="wrap">

function cell(c){const td=document.createElement('td');if(!c){td.textContent='–';return td}
